apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caos
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/felipemsousa/Calculadora-regra-de-3.git
    path: caos
    targetRevision: feature/testes
  destination:
    namespace: caos
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: web
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      name: web
      jsonPointers:
        - /status/currentReplicas
        - /status/desiredReplicas